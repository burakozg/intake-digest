# intake-digest — self-hosted stack.
#
# One container, no companion database of its own: app state is
# /data/video_digest.sqlite (plan §1.3), and the vault's CouchDB is remote
# infrastructure owned by the vault, not by this compose file (VaultConfig).
#
# Plain bridge networking, so this file runs unchanged on a NAS, a server, or
# Docker Desktop. The QNAP deployment adds a LAN address as an opt-in overlay
# (docker-compose.nas.yml) rather than a change here — this file stays the
# portable one.
#
# No TLS and no authentication beyond a shared API key (api/auth.py). Built
# for a trusted LAN, LAN-only for v1 (plan §1.10). DO NOT PORT-FORWARD IT.

name: intake-digest

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  intake-digest:
    build:
      context: .
      dockerfile: Dockerfile
    image: intake-digest:0.1.0
    container_name: intake-digest
    restart: unless-stopped
    environment:
      INTAKE_CONFIG_FILE: /config/config.yaml
      INTAKE_ADMIN_API_KEY: ${INTAKE_ADMIN_API_KEY:?set INTAKE_ADMIN_API_KEY in .env}
      # The vault's own CouchDB (obsidian-vault-writer skill) — a different
      # database, owned by a different application, so its own credentials.
      INTAKE_VAULT__COUCHDB_URL: ${VAULT_COUCHDB_URL:?set VAULT_COUCHDB_URL in .env}
      INTAKE_VAULT_COUCHDB_PASSWORD: ${VAULT_COUCHDB_PASSWORD:?set VAULT_COUCHDB_PASSWORD in .env}
      # The Mac running the ASR worker (~/projects/asr-server). Deployment
      # topology, so environment-set rather than console-editable (there is no
      # console) or committed to config.yaml.
      INTAKE_TRANSCRIPTION__REMOTE_URL: ${ASR_REMOTE_URL:?set ASR_REMOTE_URL in .env}
      # The model actually loaded on that worker — config.yaml's tracked
      # default is not necessarily what's installed there,
      # and a mismatch 404s silently forever (see ASR_MODEL in .deploy.env).
      INTAKE_TRANSCRIPTION__MODEL: ${ASR_MODEL:?set ASR_MODEL in .env}
      INTAKE_OPENROUTER_API_KEY: ${INTAKE_OPENROUTER_API_KEY:-}
      INTAKE_NTFY_TOKEN: ${INTAKE_NTFY_TOKEN:-}
      TZ: ${TZ:-Europe/Stockholm}
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - intake-digest-data:/data
    ports:
      - "8090:8090"
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=8).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  intake-digest-data:
